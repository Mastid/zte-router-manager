<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中兴路由实验室</title>
<style>
  :root{
    --bg:#f5f7fa;
    --panel:#ffffff;
    --line:#e3e8ef;
    --text:#16202e;
    --muted:#6b7787;
    --brand:#0b63c5;
    --brand-soft:#e8f1fc;
    --ok:#0f9d58;
    --warn:#d97706;
    --err:#d64545;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:12px 18px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
  h1{font-size:15px;margin:0;font-weight:650}
  .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .spacer{flex:1}
  .field{display:flex;align-items:center;gap:6px}
  select,input{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;outline:none}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  #host{width:170px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
    border-radius:8px;padding:7px 13px;color:var(--text);transition:.15s}
  button:hover{border-color:#c8d2e0;background:#fafcff}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{background:#0a57ad}
  button:disabled{opacity:.55;cursor:default}
  main{flex:1;display:flex;min-height:0}
  aside{width:352px;flex:0 0 352px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .block{padding:12px 14px;border-bottom:1px solid var(--line)}
  .block.grow{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:none}
  .block h2{font-size:12px;text-transform:none;letter-spacing:.3px;color:var(--muted);
    margin:0 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
  .block h2 .count{margin-left:auto;font-weight:500;color:var(--muted)}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0 0 10px}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  .probe-list{overflow:auto;max-height:236px;display:flex;flex-direction:column;gap:5px}
  .probe-item{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:#fcfdff;font-size:12px}
  .code{font-variant-numeric:tabular-nums;font-weight:650;min-width:34px;font-size:11.5px;
    padding:1px 5px;border-radius:5px;text-align:center;background:#eef2f7;color:var(--muted)}
  .code.s2{background:#e7f6ee;color:var(--ok)}
  .code.s3{background:#e8f1fc;color:var(--brand)}
  .code.s4{background:#fdf1e3;color:var(--warn)}
  .code.s0{background:#fdeaea;color:var(--err)}
  .probe-body{min-width:0;flex:1}
  .probe-body b{font-weight:600;display:block;font-size:12px}
  .probe-body .path{color:var(--muted);font-size:11px;word-break:break-all}
  .logbox{flex:1;overflow:auto;font-size:11.5px;margin:0 -4px}
  table{width:100%;border-collapse:collapse}
  td{padding:4px 4px;border-bottom:1px solid #f0f3f7;vertical-align:top}
  td.m{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  td.p{word-break:break-all;color:var(--text)}
  td.st{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
  .empty{color:var(--muted);font-size:12px;padding:14px 2px;line-height:1.7}
  .stage{flex:1;position:relative;background:#eef1f6;min-width:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:#eef1f6;
    text-align:center;padding:30px;z-index:2}
  .overlay .box{max-width:400px}
  .overlay h3{margin:0 0 8px;font-size:15px}
  .overlay p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.8}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;
    background:#16202e;color:#fff;padding:8px 15px;border-radius:8px;font-size:12.5px;
    transition:.2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="logo">Z</div>
  <div>
    <h1>中兴路由实验室</h1>
    <div class="sub">巡天 BE5100 Pro / ZXSLC SR7110 · 接口采集</div>
  </div>
  <div class="spacer"></div>
  <div class="field">
    <select id="scheme">
      <option value="https">https</option>
      <option value="http">http</option>
    </select>
    <input id="host" value="192.168.5.1" spellcheck="false">
  </div>
  <button class="primary" id="apply">连接</button>
  <button id="probe">探测接口</button>
</header>

<main>
  <aside>
    <div class="block">
      <h2>目标</h2>
      <p class="hint" id="targetLine">—</p>
      <p class="hint">先确认电脑已连上这台路由的 WiFi 或 LAN 口。浏览器会提示证书不受信任，这是路由器自签证书，选择继续访问即可。</p>
    </div>

    <div class="block">
      <h2>接口探测 <span class="count" id="probeMeta"></span></h2>
      <div class="probe-list" id="probeList">
        <div class="empty">点右上角「探测接口」，会依次试常见的 9 个入口，看这台固件认哪一套。</div>
      </div>
    </div>

    <div class="block grow">
      <h2>请求日志 <span class="count" id="logMeta">0</span></h2>
      <div class="logbox" id="logBox">
        <div class="empty">在右侧后台里登录、点开「设备列表」「WiFi 设置」，这里会实时记录每一条请求。</div>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="copy">复制全部日志</button>
        <button id="clear">清空</button>
      </div>
    </div>
  </aside>

  <div class="stage">
    <div class="overlay" id="overlay">
      <div class="box">
        <h3>准备就绪</h3>
        <p>点右上角「连接」加载路由器后台。首次会提示证书风险，选「高级 → 继续前往」。</p>
      </div>
    </div>
    <iframe id="frame" title="router"></iframe>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let lastId = 0;
let logs = [];

function toast(msg, err) {
  const el = $('#toast');
  el.textContent = msg;
  el.style.background = err ? '#d64545' : '#16202e';
  el.className = 'toast show';
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.className = 'toast'), 2200);
}

function statusClass(code) {
  if (!code) return 's0';
  if (code < 300) return 's2';
  if (code < 400) return 's3';
  if (code < 500) return 's4';
  return 's0';
}

async function loadState() {
  const s = await fetch('/__state').then((r) => r.json());
  $('#host').value = s.host;
  $('#scheme').value = s.scheme;
  const port = (s.scheme === 'https' && s.port === 443) || (s.scheme === 'http' && s.port === 80)
    ? '' : ':' + s.port;
  $('#targetLine').textContent = s.scheme + '://' + s.host + port;
}

async function applyTarget() {
  const host = $('#host').value.trim();
  if (!host) return toast('请填写路由器地址', true);
  const btn = $('#apply');
  btn.disabled = true;
  btn.textContent = '连接中';
  try {
    const res = await fetch('/__target', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, scheme: $('#scheme').value }),
    }).then((r) => r.json());
    if (!res.ok) throw new Error(res.error || '设置失败');
    await loadState();
    $('#overlay').style.display = 'none';
    $('#frame').src = '/';
    toast('已连接 ' + res.state.host);
  } catch (e) {
    toast('连接失败：' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '连接';
  }
}

async function probe() {
  const btn = $('#probe');
  btn.disabled = true;
  btn.textContent = '探测中';
  $('#probeMeta').textContent = '';
  try {
    const res = await fetch('/__probe').then((r) => r.json());
    const list = $('#probeList');
    list.innerHTML = res.results.map((r) => `
      <div class="probe-item">
        <span class="code ${statusClass(r.status)}">${r.status || 'ERR'}</span>
        <div class="probe-body">
          <b>${r.label}${r.ms ? ' · ' + r.ms + 'ms' : ''}</b>
          <div class="path">${r.path}</div>
        </div>
      </div>`).join('');
    const alive = res.results.filter((r) => r.status === 200).length;
    $('#probeMeta').textContent = alive + '/9 可用';
    pollLog();
  } catch (e) {
    toast('探测失败：' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '探测接口';
  }
}

function renderLog() {
  const box = $('#logBox');
  if (!logs.length) return;
  const rows = logs.slice(-140).reverse().map((x) => `
    <tr>
      <td class="m">${x.t}</td>
      <td class="p">${x.method === 'PROBE' ? '[探测] ' : ''}${x.path}</td>
      <td class="st" style="color:${x.status >= 400 || !x.status ? '#d64545' : x.status >= 300 ? '#0b63c5' : '#0f9d58'}">${x.status || 'ERR'}</td>
    </tr>`).join('');
  box.innerHTML = '<table>' + rows + '</table>';
}

async function pollLog() {
  try {
    const res = await fetch('/__log?since=' + lastId).then((r) => r.json());
    if (res.items.length) {
      logs = logs.concat(res.items);
      if (logs.length > 800) logs = logs.slice(-800);
      lastId = res.last;
      $('#logMeta').textContent = logs.length + ' 条';
      renderLog();
    }
  } catch (e) {}
}

$('#apply').addEventListener('click', applyTarget);
$('#probe').addEventListener('click', probe);
$('#host').addEventListener('keydown', (e) => { if (e.key === 'Enter') applyTarget(); });

$('#copy').addEventListener('click', async () => {
  if (!logs.length) return toast('还没有日志', true);
  const text = logs.map((x) => `${x.method} ${x.path}\n  → ${x.status} ${x.ctype || ''} ${x.ms || 0}ms${x.resp ? '\n  ' + x.resp.replace(/\s+/g, ' ').slice(0, 300) : ''}`).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制 ' + logs.length + ' 条，粘贴给助手即可');
  } catch (e) {
    toast('复制失败，请手动选中日志区', true);
  }
});

$('#clear').addEventListener('click', async () => {
  await fetch('/__clear');
  logs = []; lastId = 0;
  $('#logMeta').textContent = '0';
  $('#logBox').innerHTML = '<div class="empty">已清空。</div>';
});

loadState();
setInterval(pollLog, 1200);
</script>
</body>
</html>
